schema: spec-driven

# Project context (constraints an agent cannot infer from the code).
context: |
  `color-scheme-generator` is the color-scheme CLI (`csg`) of the dotfiles CLI
  toolchain (spine AD-1/AD-2/AD-5/AD-7). One package, repo root = package root:
  `src/color_scheme_generator/`, `tests/` at the top level, no nested project
  roots. It extracts color palettes from wallpaper images locally or through a
  container backend (custom / pywal / wallust), and it owns both its Dockerfiles
  (`src/color_scheme_generator/adapters/docker/Dockerfile.{base,custom,pywal,
  wallust}`) and the `install` build verb. The image build context is this repo
  root: the Dockerfiles copy only repo-relative paths, never a sibling repo or a
  parent directory (AD-5). The image tag is the pin, not `latest` (AD-7). It
  consumes `cli-output`, `config-assembler-engine`, `oci-runtime` and
  `cli-invocation-contract` as immutable git tags, never paths. It does not own
  the runtime <-> CLI invocation contract; the conformance kit lives in the
  `contracts` repo (AD-4). The bundled template catalog
  (`src/color_scheme_generator/defaults/templates/`) is a public asset surface:
  `dotfiles-v3` provisioning copies it from the pinned checkout (AD-10).
  Repo contract in AGENTS.md (CLAUDE.md symlinks there) applies to all artifacts.

# Per-artifact rules (from mu; the evidence rule is not optional).
rules:
  proposal:
    - "Every claim carries Evidence (file path + lines, commit SHA, URL + quote, or prototype command + observed output) and a one-command Verify step; mark Evidence MISSING rather than stating unproven claims as fact."
    - "Always state what is out of scope."
  specs:
    - "Each requirement states its acceptance check (command to run + expected result)."
    - "Cite the source of each requirement (prior-art path, user statement, or prototype output)."
  design:
    - "Include a verification plan - what prototype or test validates each key decision, with exact commands."
    - "No component without an evidence-backed reason to exist."
  tasks:
    - "Each task ends with an observable check (command + expected output); break tasks into chunks of max 2 hours."
